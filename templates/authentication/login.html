<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/authentication/login.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/download.png') }}">
    <title>Log In</title>
</head>
<body>
    <div class="navbar">
        <div class="dropdown">
            <button class="dropbtn" >Account</button>
            <div class="dropdown-content">  
              <a href="{{ url_for('main.profile') }}">Profile</a>
              <a href="{{ url_for('auth.signup') }}">Sign Up</a>
              <a href="{{ url_for('auth.logout') }}" >Log out</a>
            </div>
        </div> 
            <a style="float:left" href="/">Home</a>
            <a href="/menu">Menu</a>
            <a href="/aboutus">About Us</a>
    </div>
    
    {% block content %}
    <div class="container">
        <h3 class="title">Login:</h3>
        <div class="box">
            {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="notification is-danger">
                    {{ messages[0] }}
                </div>
            {% endif %}
            {% endwith %}
            <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
                <div class="field">
                    <div class="control">
                        <input class="input is-large" type="email" name="email" placeholder="Your Email" autofocus="">
                    </div>
                </div>

                <div class="field">
                    <div class="control">
                        <input class="input is-large" type="password" name="password" placeholder="Your Password">
                    </div>
                </div>
                <div class="field">
                    <label class="checkbox">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>
                </div>
                <button class="button">Login</button>
            </form>
        </div>
    </div>
    {% endblock %}   
</body>
</html>
